<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inória</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#0b1320;
color:white;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 80px;
background:#071022;
}

.logo{
color:#ff2e63;
font-weight:bold;
font-size:22px;
text-decoration:none;
}

nav ul{
display:flex;
gap:40px;
list-style:none;
}

nav ul li{
color:#cbd5e1;
cursor:pointer;
}

.nav-buttons a{
padding:10px 20px;
border-radius:25px;
text-decoration:none;
margin-left:10px;
}

.btn-login{
background:transparent;
border:1px solid #334155;
color:white;
}

.btn-register{
background:#ff2e63;
color:white;
}

.container{
max-width:1000px;
margin:20px auto;
background:black;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

h1{
text-align:center;
margin-bottom:20px;
}

label{
display:block;
margin-top:10px;
font-weight:bold;
}

input,select{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:5px;
}

.trimestre{
margin-top:20px;
padding:15px;
border:1px solid #ddd;
border-radius:8px;
}

.row{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

button{
margin-top:20px;
padding:12px;
width:100%;
background:#ff2e63;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.limpar{
background:red;
margin-bottom:15px;
}

.tabela-container{
width:100%;
overflow:auto;
margin-top:30px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th{
background:blue;
color:white;
}

th,td{
border:1px solid #ccc;
padding:8px;
text-align:center;
color:black;
}

h2{
text-align:center;
margin:30px 0 15px;
}

@media(max-width:768px){

nav{
flex-direction:column;
gap:15px;
padding:20px;
}

nav ul{
flex-wrap:wrap;
justify-content:center;
}

.row{
grid-template-columns:1fr;
}

}
</style>
</head>

<body>

<nav>
<a href="../index.html" class="logo">❤ Início</a>

<ul>
<li>Inória</li>
<li>Domingos</li>
<li>Reais</li>
<li>Lisboa</li>
</ul>

<div class="nav-buttons">
<a href="ttt2.html" class="btn-login">Voltar</a>
<a href="trimestre3.html" class="btn-register">III° Trimestre</a>
</div>
</nav>

<div class="container">

<h1>Cadastro de Notas</h1>

<form id="formulario">

<label>Nome do Aluno</label>
<input type="text" id="nome" required>

<label>Disciplina</label>
<select id="disciplina" required>
<option value="">Selecione</option>
<option>Matemática</option>
<option>TLP</option>
<option>Sistema de Informação</option>
<option>IAG</option>
<option>Empreendedorismo</option>
<option>Projecto Tecnológico</option>
</select>

<div class="trimestre">
<h3>I Trimestre</h3>

<div class="row">
<div>
<label>MAC</label>
<input type="number" id="mac1">
</div>

<div>
<label>PP</label>
<input type="number" id="pp1">
</div>

<div>
<label>PT</label>
<input type="number" id="pt1">
</div>
</div>
</div>

<div class="trimestre">
<h3>II Trimestre</h3>

<div class="row">
<div>
<label>MAC</label>
<input type="number" id="mac2">
</div>

<div>
<label>PP</label>
<input type="number" id="pp2">
</div>

<div>
<label>PT</label>
<input type="number" id="pt2">
</div>
</div>
</div>

<div class="trimestre">
<h3>III Trimestre</h3>

<div class="row">
<div>
<label>MAC</label>
<input type="number" id="mac3">
</div>

<div>
<label>PP</label>
<input type="number" id="pp3">
</div>

<div>
<label>PT</label>
<input type="number" id="pt3">
</div>
</div>
</div>

<button type="submit">Guardar Dados</button>

</form>

<h2>Tabela de Notas</h2>

<button class="limpar" onclick="limparDados()">
Limpar Todos os Dados
</button>

<div class="tabela-container">

<table>

<thead>
<tr>
<th>Aluno</th>
<th>Disciplina</th>

<th>MAC T1</th>
<th>PP T1</th>
<th>PT T1</th>

<th>MAC T2</th>
<th>PP T2</th>
<th>PT T2</th>

<th>MAC T3</th>
<th>PP T3</th>
<th>PT T3</th>

<th>Média Final</th>
<th>Resultado</th>
</tr>
</thead>

<tbody id="corpoTabela"></tbody>

</table>

</div>

</div>

<script>

function carregarTabela(){

let dados = JSON.parse(localStorage.getItem("notas")) || [];

let tabela = document.getElementById("corpoTabela");

tabela.innerHTML = "";

dados.forEach(item=>{

let notas = [
Number(item.mac1 || 0),
Number(item.pp1 || 0),
Number(item.pt1 || 0),
Number(item.mac2 || 0),
Number(item.pp2 || 0),
Number(item.pt2 || 0),
Number(item.mac3 || 0),
Number(item.pp3 || 0),
Number(item.pt3 || 0)
];

let soma = notas.reduce((total, nota)=> total + nota, 0);

let media = (soma/notas.length).toFixed(1);

let resultado="";
let cor="";

if(media < 7){
resultado="Reprovado";
cor="red";
}
else if(media >= 10){
resultado="Aprovado";
cor="green";
}
else{
resultado="Recurso";
cor="orange";
}

tabela.innerHTML += `
<tr>
<td>${item.nome}</td>
<td>${item.disciplina}</td>

<td>${item.mac1}</td>
<td>${item.pp1}</td>
<td>${item.pt1}</td>

<td>${item.mac2}</td>
<td>${item.pp2}</td>
<td>${item.pt2}</td>

<td>${item.mac3}</td>
<td>${item.pp3}</td>
<td>${item.pt3}</td>

<td><strong>${media}</strong></td>

<td style="color:${cor};font-weight:bold;">
${resultado}
</td>

</tr>
`;

});

}

document.getElementById("formulario").addEventListener("submit", function(e){

e.preventDefault();

let dados = JSON.parse(localStorage.getItem("notas")) || [];

dados.push({

nome: document.getElementById("nome").value,
disciplina: document.getElementById("disciplina").value,

mac1: document.getElementById("mac1").value,
pp1: document.getElementById("pp1").value,
pt1: document.getElementById("pt1").value,

mac2: document.getElementById("mac2").value,
pp2: document.getElementById("pp2").value,
pt2: document.getElementById("pt2").value,

mac3: document.getElementById("mac3").value,
pp3: document.getElementById("pp3").value,
pt3: document.getElementById("pt3").value

});

localStorage.setItem("notas", JSON.stringify(dados));

alert("Dados guardados com sucesso!");

this.reset();

carregarTabela();

});

function limparDados(){

if(confirm("Deseja apagar todos os registos?")){

localStorage.removeItem("notas");

carregarTabela();

}

}

carregarTabela();

</script>

</body>
 </html>
